# Crea l'app per computer su Windows e Mac veri e l'app per i tablet Android dei negozi (APK).
# - Ogni modifica proposta (pull request): crea i file e li lascia da scaricare tra gli "Artifacts" del controllo, per provarli.
# - Un tag vX.Y.Z (es. v1.0.1), oppure "Run workflow" dalla scheda Actions: crea i file e li pubblica nella Release
#   della versione scritta in package.json, con nomi fissi, così i link
#   https://github.com/danieledelprete4/genio-app/releases/latest/download/<nome> restano sempre uguali.
name: App per computer e tablet

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# nel registro del controllo si vede quale file scarica electron-builder (utile se un download non riesce)
env:
  DEBUG: electron-builder,@electron/get:index

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # fino a 3 tentativi: i download di Electron ogni tanto rispondono 504
      - name: Crea l'installer
        shell: bash
        run: for i in 1 2 3; do npx electron-builder --win nsis --x64 --publish never && exit 0; sleep 20; done; exit 1
      - name: Nomi fissi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/Genio-win-x64.exe out/Genio-Windows-Setup.exe
          Compress-Archive -Path out/Genio-Windows-Setup.exe -DestinationPath out/Genio-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/*, if-no-files-found: error }

  mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # fino a 3 tentativi: i download di Electron ogni tanto rispondono 504
      - name: Crea le app
        run: for i in 1 2 3; do npx electron-builder --mac dir --x64 --arm64 --publish never && exit 0; sleep 20; done; exit 1
      # firma ad-hoc (senza account Apple): al primo avvio si autorizza in Privacy e sicurezza.
      # ditto conserva i collegamenti interni dell'app, che uno zip normale perderebbe.
      - name: Firma ad-hoc e zip
        run: |
          mkdir -p out
          for pair in "mac-arm64:AppleSilicon" "mac:Intel"; do
            d="${pair%%:*}"; n="${pair##*:}"
            codesign --force --deep --sign - "dist/$d/Genio.app"
            codesign --verify --deep --strict "dist/$d/Genio.app"
            ditto -c -k --sequesterRsrc --keepParent "dist/$d/Genio.app" "out/Genio-Mac-$n.zip"
          done
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: out/*, if-no-files-found: error }

  # APK per i tablet: firmato con la chiave dei negozi (segreti del repository). Senza la stessa chiave
  # i tablet non accettano gli aggiornamenti, per questo la pubblicazione si ferma se i segreti mancano.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Chiave di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/negozi.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/negozi.jks" >> "$GITHUB_ENV"
          elif [ "$EVENTO" != "pull_request" ]; then
            echo "::error::Manca il segreto ANDROID_KEYSTORE_BASE64: senza la chiave dei negozi l'APK non si pubblica"; exit 1
          else
            echo "::notice::APK di prova firmato con la chiave di prova (solo per provarlo, non per aggiornare i tablet)"
          fi
      - name: Crea l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Nome fisso
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Genio-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Genio ${{ steps.v.outputs.tag }}
          files: out/*
          body: |
            App Genio per computer.
            - Windows 10 e 11: Genio-Windows-Setup.exe (oppure Genio-Windows.zip se il browser blocca l'exe)
            - Mac con chip Apple (M1, M2, M3, M4...): Genio-Mac-AppleSilicon.zip
            - Mac con processore Intel: Genio-Mac-Intel.zip
            - Tablet Android dei negozi (Android 8 o successivo): Genio-Android.apk
