<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'">
<title>Genio</title>
<link rel="stylesheet" href="stile.css">
</head>
<body data-page="indirizzo">
<div class="box">
  <img class="logo" src="logo.svg" alt="">
  <h1 id="titolo">Collega il tablet a Genio</h1>
  <p id="testo">Inquadra il QR che l'amministratore trova in Genio, in Utenti e accessi &gt; Negozi. Serve solo la prima volta.</p>
  <button type="button" id="qr"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M11 15h2v2h-2zm4 0h2v2h-2zm-4-4h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zM3 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm6 1a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zM3 13a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1z"/></svg><span id="qrt">Inquadra il QR</span></button>
  <div class="or">oppure scrivi l'indirizzo</div>
  <form id="f">
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="nome.vercel.app" aria-label="Indirizzo di Genio">
    <div class="row">
      <button type="button" class="sec" id="annulla" hidden>Annulla</button>
      <button type="submit" class="sec" id="ok">Collega</button>
    </div>
  </form>
  <div class="err" id="err" role="alert"></div>
  <div class="hint" id="hint">Per cambiarlo dopo: tieni premuta l'icona di Genio e scegli Cambia indirizzo.</div>
</div>
<script src="pagine.js"></script>
</body>
</html>
